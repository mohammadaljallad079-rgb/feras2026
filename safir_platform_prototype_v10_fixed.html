const coCur=id=>id===0?'BHD':(S.companies.find(x=>x.id===id)||{}).cur;
const U=id=>(S.users.find(u=>u.id===id)||{name:'-'}).name;
const me=()=>S.users.find(u=>u.id===ROLES[role][2]);
const myCo=()=>me().co;
const isMgr=()=>role==='mgr'||role==='mgr2';
function ensure(){const per=curPer();
 S.companies.filter(c=>c.status==='active').concat([{id:0}]).forEach(c=>{if(!S.reports.some(r=>r.co===c.id&&r.per===per))S.reports.push({id:uid++,co:c.id,per,status:'draft',vals:{},snap:S.fields.filter(f=>f.on).map(f=>({...f})),hist:[{t:'created',d:TODAY}],reason:'',narr:'',bank:false})});}
function log(a){S.audit.unshift({d:TODAY,u:me().name,r:ROLES[role][0],a})}
function mail(to,sub,body){const rec=Array.isArray(to)?to:[to];S.mails.unshift({to:rec.map(U).join('، '),sub,body:body||'',d:TODAY});updMail()}
const usersOf=r=>S.users.filter(u=>u.roles.includes(r)&&u.on).map(u=>u.id);
function updMail(){$('#mailN').textContent=S.mails.length;$('#mails').innerHTML=`<b>البريد المحاكى (لا يُرسل فعلياً)</b>`+(S.mails.length?S.mails.slice(0,30).map(m=>`<div class="mail"><b>${esc(m.sub)}</b><br><span class="muted">إلى: ${esc(m.to)} · ${m.d}</span><div>${esc(m.body)}</div></div>`).join(''):'<p class="muted">لا رسائل بعد.</p>')}
function mailsT(){$('#mails').classList.toggle('on')}
function notifyDue(){const per=curPer(),due=dueOf(per),n=dd(due,TODAY);
 S.reports.filter(r=>r.per===per&&r.co!==0&&['draft','returned'].includes(r.status)).forEach(r=>{const c=S.companies.find(x=>x.id===r.co);if(!c||!c.mgr)return;const k=`${r.id}|${TODAY}`;if(S.mailKeys[k])return;
  if(n===3){mail(c.mgr,'تنبيه: التقرير يُستحق بعد 3 أيام',coName(r.co)+' - '+per);S.mailKeys[k]=1}
  else if(n===0){mail(c.mgr,'اليوم موعد استحقاق التقرير',coName(r.co)+' - '+per);S.mailKeys[k]=1}
  else if(n<0){mail(c.mgr,'تقرير متأخر (رسالة يومية)',coName(r.co)+' - متأخر '+(-n)+' يوم');S.mailKeys[k]=1}})}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}

/* modal forms */
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
function form(title,fs,ok,cb,extra){
 const h=fs.map(f=>{const v=f.v==null?'':f.v;
  if(f.t==='area')return `<label class="f">${f.l}${f.r?' *':''}<textarea name="${f.k}" rows="3">${esc(v)}</textarea></label>`;
  if(f.t==='sel')return `<label class="f">${f.l}${f.r?' *':''}<select name="${f.k}"><option value="">${T('اختر...','Select...')}</option>${f.o.map(o=>`<option value="${o[0]}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if(f.t==='chk')return `<label class="f c"><input type="checkbox" name="${f.k}" ${v?'checked':''}>${f.l}</label>`;
  if(f.t==='multi')return `<div class="f"><b style="font-size:13px">${f.l}</b>${f.o.map(o=>`<label class="f c"><input type="checkbox" name="${f.k}" value="${o[0]}">${esc(o[1])}</label>`).join('')}</div>`;
  if(f.t==='file')return `<label class="f">${f.l}${f.r?' *':''}<input type="file" name="${f.k}"></label>`;
  return `<label class="f">${f.l}${f.r?' *':''}<input type="${f.t||'text'}" name="${f.k}" value="${esc(v)}"></label>`}).join('');
 modal(`<h3>${title}</h3><form id="mf" novalidate>${h}${extra||''}<div class="err" id="merr"></div><div class="actions"><button type="button" class="btn" onclick="closeM()">${T('إلغاء','Cancel')}</button><button class="btn p">${ok}</button></div></form>`);
 $('#mf').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o={};
  for(const f of fs){if(f.t==='multi')o[f.k]=fd.getAll(f.k);else if(f.t==='chk')o[f.k]=!!e.target.elements[f.k].checked;else if(f.t==='file'){const x=e.target.elements[f.k].files[0];o[f.k]=x?x.name:''}else o[f.k]=String(fd.get(f.k)||'').trim();
   if(f.r&&(!o[f.k]||(Array.isArray(o[f.k])&&!o[f.k].length)))return $('#merr').textContent=T('الحقل مطلوب: ','Required: ')+f.l.replace(/<[^>]*>/g,'')}
  const r=cb(o);if(typeof r==='string')return $('#merr').textContent=r;closeM();render()}}

const navFor=()=>NAV.filter(n=>n[3].includes(role));

function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $('#langB').textContent=lang==='ar'?'EN':'ع';
 $('#tSite').textContent=T('الموقع العام','Public site');$('#tPlat').textContent=T('المنصة الداخلية','Internal platform');

  const [v,arg]=route.split(':');const fn=V[v]||V.dash;$('#main').innerHTML=fn(arg)}
 updMail()}
const head=(t,s,btn)=>`<div class="ph"><div><h2>${t}</h2>${s?`<p>${s}</p>`:''}</div><div class="row">${btn||''}</div></div>`;
const tbl=(h,rows,empty)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${h.length}" class="muted">${empty||T('لا سجلات','No records')}</td></tr>`}</tbody></table></div>`;

/* views */
const V={};
function repAlert(r){const n=dd(dueOf(r.per),TODAY);let m='',k='info';
 if(['draft','returned'].includes(r.status)){if(n<0){m=T(`متأخر ${-n} يوماً عن موعد 5 ${dueOf(r.per).slice(5,7)}`,`${-n} day(s) overdue`);k='bad'}else if(n===0){m=T('اليوم موعد الاستحقاق','Due today');k='warn'}else if(n<=3){m=T(`يستحق بعد ${n} أيام`,`Due in ${n} days`);k='warn'}else m=T(`يستحق في ${dueOf(r.per)}`,`Due ${dueOf(r.per)}`)}
 return m?`<div class="alert ${k}">${T('تقرير','Report')} ${r.per} · ${coName(r.co)}: ${m}</div>`:''}
V.dash=()=>{const per=curPer();let h=head(T('لوحة التحكم','Dashboard'),`${T('الفترة الحالية','Current period')}: ${per} · ${T('الاستحقاق','due')} ${dueOf(per)}`);
 const kp=(n,l,r)=>`<div class="card kpi" ${r?`style="cursor:pointer" onclick="go('${r}')"`:''}><b>${n}</b><span>${l}</span></div>`;
 const late=S.reports.filter(r=>r.per===per&&['draft','returned'].includes(r.status)&&dd(dueOf(r.per),TODAY)<0&&r.co!==0);
 if(role==='owner'){
  const act=S.companies.filter(c=>c.status==='active');
  h+=`<div class="grid">${kp(act.length,T('شركات نشطة','Active companies'),'companies')}${kp(S.reports.filter(r=>r.status==='sent'&&r.per===per).length,T('تقارير معتمدة للفترة','Approved reports (period)'),'reports')}${kp(late.length,T('تقارير متأخرة','Late reports'),'reports')}${kp(S.opps.filter(o=>o.status==='sent').length,T('قرارات بانتظارك','Pending decisions'),'opps')}${kp(S.dirs.filter(d=>d.status!=='done').length,T('توجيهات مفتوحة','Open directives'),'dirs')}${kp(S.leads.length,T('عملاء محتملون','Leads'),'leads')}</div>`;
  h+=`<div class="sec">${T('ملخص المجموعة (كل شركة بعملتها، دون جمع)','Group summary (each company in its own currency, not summed)')}</div>`+tbl([T('الشركة','Company'),T('الملكية','Ownership'),T('العملة','Currency'),T('إيراد آخر تقرير معتمد','Revenue, last approved'),T('الحالة','Status')],act.map(c=>{const r=[...S.reports].reverse().find(x=>x.co===c.id&&x.status==='sent');return `<tr><td>${esc(T(c.ar,c.en))}</td><td>${c.own==='0'?T('إدارة فقط (0%)','Managed only (0%)'):c.own+'%'}</td><td>${c.cur}</td><td>${r?fmt(r.vals.rev)+' ('+r.per+')':'—'}</td><td>${late.some(x=>x.co===c.id)?'<span class="chip bad">'+T('متأخر','Late')+'</span>':'<span class="chip ok">'+T('منتظم','On track')+'</span>'}</td></tr>`}));
  h+=`<div class="sec">${T('رسائل المستشار الموجهة إليك','Advisor messages addressed to you')}</div>`+tbl([T('العنوان','Title'),T('النوع','Type')],S.adv.filter(a=>a.to==='owner').map(a=>`<tr><td>${esc(a.title)}</td><td>${a.kind}</td></tr>`));
 }else if(isMgr()){const c=S.companies.find(x=>x.id===myCo());
  h+=repAlertsFor(myCo());
  h+=`<div class="grid">${kp(coName(c.id),T('شركتك','Your company'))}${kp(S.reqs.filter(r=>r.co===c.id&&r.status!=='done').length,T('طلبات مفتوحة','Open requests'),'reqs')}${kp(S.leads.filter(l=>l.co===c.id).length,T('عملاء محولون','Routed leads'),'leads')}${kp(S.dirs.filter(d=>d.to===me().id&&d.status!=='done').length,T('توجيهاتي','My directives'),'dirs')}</div>
  <div class="actions" style="justify-content:flex-start"><button class="btn p" onclick="go('reports')">${T('تقرير جديد','New report')}</button><button class="btn" onclick="newReq()">${T('طلب خدمة جديد','New service request')}</button><button class="btn" onclick="newEmp()">${T('إضافة موظف','Add employee')}</button><button class="btn" onclick="go('leads')">${T('العملاء المحولون','Routed leads')}</button><button class="btn" onclick="go('dirs')">${T('توجيهاتي','My directives')}</button></div>
  <div class="sec">${T('اختبار العزل (AT-02)','Isolation test (AT-02)')}</div><button class="btn d" onclick="go('rep:'+S.reports.find(r=>r.co!==myCo()&&r.co!==0).id)">${T('فتح تقرير شركة أخرى عبر الرابط المباشر','Open another company’s report by direct link')}</button>`;
 }else if(role==='acc'){
  const pend=S.reports.filter(r=>['submitted','resubmitted'].includes(r.status)),ap=S.reports.filter(r=>r.status==='approved');
  h+=`<div class="grid">${kp(pend.length,T('تقارير بانتظار المراجعة','Awaiting review'),'reports')}${kp(ap.length,T('معتمدة وغير مرسلة للإدارة','Approved, not sent'),'reports')}${kp(S.acct.exp.length+S.acct.inv.length+S.acct.com.length,T('سجلات القابضة','Holding records'),'holding')}</div><div class="actions" style="justify-content:flex-start"><button class="btn p" onclick="go('reports')">${T('مراجعة تقرير','Review report')}</button><button class="btn" onclick="go('holding')">${T('مصروف / فاتورة / عمولة جديدة','New expense / invoice / commission')}</button></div>`;
 }else if(role==='bd'){
  h+=repAlertsFor(0)+`<div class="grid">${kp(S.reports.filter(r=>r.status==='sent'&&r.per===per).length,T('تقارير المجموعة المعتمدة','Approved group reports'),'reports')}${kp(S.leads.length,T('عملاء محتملون','Leads'),'leads')}${kp(S.opps.length,T('فرص','Opportunities'),'opps')}${kp(S.subs.filter(s=>s.status==='new').length,T('طلبات من الموقع','Website submissions'),'site')}${kp(S.adv.filter(a=>a.to==='bd').length,T('رسائل المستشار','Advisor messages'),'advisor')}${kp(S.tasks.length,T('مهام من المساعد','Assistant tasks'))}</div>`;
 }else if(role==='mkt'){h+=`<div class="grid">${kp(S.leads.filter(l=>l.by===me().id).length,T('عملائي','My leads'),'leads')}</div><div class="actions" style="justify-content:flex-start"><button class="btn p" onclick="newLead()">${T('عميل محتمل جديد','New lead')}</button><button class="btn" onclick="complain()">${T('إرسال شكوى للمالك','Send complaint to Owner')}</button></div>`;
 }else if(role==='des'){h+=`<div class="grid">${kp(S.reqs.filter(r=>r.type==='des'&&r.status!=='done').length,T('طلبات تصميم مفتوحة','Open design requests'),'reqs')}</div>`;
 }else{h+=`<div class="grid">${kp(S.adv.length,T('رسائلي','My messages'),'advisor')}</div>`}
 return h};
function repAlertsFor(co){return S.reports.filter(r=>r.co===co&&r.per===curPer()).map(repAlert).join('')}

/* companies */
V.companies=()=>{const rows=S.companies.filter(c=>c.status!=='closed').map(c=>`<tr><td>${c.code}</td><td>${esc(T(c.ar,c.en))}</td><td>${cn(c.country)}</td><td>${c.cur}</td><td>${esc(U(c.mgr))}</td><td>${c.own==='0'?T('إدارة فقط (0%)','Managed only (0%)'):c.own+'%'}</td><td>${c.status==='draft'?'<span class="chip warn">'+T('مسودة','Draft')+'</span>':'<span class="chip ok">'+T('نشطة','Active')+'</span>'}</td><td class="row">${c.status==='draft'?`<button class="btn" onclick="actCo(${c.id})">${T('تفعيل','Activate')}</button>`:''}<button class="btn" onclick="coNote(${c.id})">${T('ملاحظة سرية','Private note')}</button><button class="btn d" onclick="closeCo(${c.id})">${T('إغلاق','Close')}</button></td></tr>`);
 const arch=S.companies.filter(c=>c.status==='closed');
 return head(T('الشركات','Companies'),T('الإنشاء والإغلاق للمالك فقط. الشركة المغلقة تختفي من القوائم والتقارير والتنبيهات.','Only the Owner creates and closes companies.'),`<button class="btn p" onclick="coWiz()">${T('إضافة شركة','Add company')}</button>`)+tbl([T('الرمز','Code'),T('الاسم','Name'),T('الدولة','Country'),T('العملة','Currency'),T('المدير','Manager'),T('الملكية','Ownership'),T('الحالة','Status'),''],rows)+`<div class="sec">${T('الأرشيف (الشركات المغلقة)','Archive (closed companies)')}</div>`+tbl([T('الرمز','Code'),T('الاسم','Name')],arch.map(c=>`<tr><td>${c.code}</td><td>${esc(T(c.ar,c.en))}</td></tr>`),T('الأرشيف فارغ','Archive empty'))};
let wiz={};
function coWiz(step,data){
 const mg=S.users.filter(u=>u.roles.includes('mgr')).map(u=>[u.id,u.name]);
 wiz=Object.assign(wiz,data||{});if(!step)wiz={};step=step||1;
 const mods={1:[{k:'ar',l:T('اسم الشركة بالعربية','Company name (Arabic)'),r:1,v:wiz.ar},{k:'en',l:T('اسم الشركة بالإنجليزية','Company name (English)'),r:1,v:wiz.en},{k:'country',l:T('الدولة','Country'),t:'sel',o:COUNTRIES.map(c=>[c[0],T(c[1],c[2])]),r:1,v:wiz.country},{k:'sector',l:T('القطاع','Sector'),t:'sel',o:SECT.map(s=>[s[0],T(s[1],s[2])]),r:1,v:wiz.sector},{k:'cr',l:T('رقم السجل التجاري (إن وجد)','Commercial registration (if any)'),v:wiz.cr}],
 2:[{k:'cur',l:T('العملة المحلية','Local currency'),t:'sel',o:CUR.map(c=>[c,c]),r:1,v:wiz.cur},{k:'email',l:T('البريد الإلكتروني للشركة','Company email'),v:wiz.email},{k:'phone',l:T('رقم التواصل','Contact number'),v:wiz.phone},{k:'mgr',l:T('مدير الشركة (من المستخدمين الحاليين)','Manager (existing user)'),t:'sel',o:mg,v:wiz.mgr}],
 3:[{k:'rel',l:T('العلاقة بالقابضة','Relationship'),t:'sel',o:[['own',T('نسبة ملكية فعلية','Actual ownership %')],['man',T('إدارة فقط (0%)','Managed only (0%)')]],r:1,v:wiz.rel},{k:'pct',l:T('نسبة الملكية % (عند الملكية الفعلية)','Ownership % (if actual)'),t:'number',v:wiz.pct}]}[step];
 form(`${T('إضافة شركة','Add company')} — ${step}/4`,step<4?mods:[],step<4?T('التالي','Next'):T('حفظ','Save'),o=>{
  Object.assign(wiz,o);
  if(step===3){if(wiz.rel==='own'&&!(+wiz.pct>0&&+wiz.pct<=100))return T('أدخل نسبة ملكية بين 1 و100','Enter ownership 1–100');}
  if(step<3){setTimeout(()=>coWiz(step+1),0);return}
  if(step===3){setTimeout(()=>coWiz(4),0);return}
  },'');
 if(step===4){
  $('#mbox').innerHTML=`<h3>${T('مراجعة قبل الحفظ','Review before saving')} — 4/4</h3><div class="card" style="margin-bottom:10px">${esc(wiz.ar)} / ${esc(wiz.en)}<br>${cn(wiz.country)} · ${wiz.cur} · ${T('الملكية','Ownership')}: ${wiz.rel==='man'?T('إدارة فقط 0%','Managed only 0%'):wiz.pct+'%'}<br>${T('المدير','Manager')}: ${esc(U(wiz.mgr))}</div><div class="err" id="merr"></div><div class="actions"><button class="btn" onclick="closeM();toast('${T('حُفظت المسودة عند الخروج','Draft saved on exit')}');saveCo('draft')">${T('خروج وحفظ كمسودة','Exit & save draft')}</button><button class="btn p" onclick="saveCo('active')">${T('حفظ وتفعيل','Save & activate')}</button></div>`}
 else{const b=document.querySelector('#mf .actions');if(b)b.insertAdjacentHTML('afterbegin',`<button type="button" class="btn" onclick="closeM();if(wiz.ar)saveCo('draft')">${T('حفظ كمسودة والخروج','Save draft & exit')}</button>`)}}
function saveCo(st){
 if(S.companies.some(c=>c.cr&&wiz.cr&&c.cr===wiz.cr)){$('#merr').textContent=T('رقم السجل مكرر','Duplicate registration number');return}
 const id=S.companies.length+1;S.companies.push({id,code:'SUP-'+pad(id).padStart(3,'0'),ar:wiz.ar,en:wiz.en,country:wiz.country,sector:wiz.sector,cur:wiz.cur,mgr:wiz.mgr||'',own:wiz.rel==='man'?'0':wiz.pct,status:st,show:false,cr:wiz.cr,act_ar:'',act_en:'',note:''});
 if(wiz.mgr){const u=S.users.find(x=>x.id===wiz.mgr);u.co=id}
 log('إنشاء شركة '+wiz.ar+' ('+st+')');if(st==='active')ensure();closeM();render();toast(T('تم الحفظ. بلا أرصدة افتتاحية ولا نموذج منفصل.','Saved. No opening balances.'))}
function actCo(id){S.companies.find(c=>c.id===id).status='active';ensure();log('تفعيل شركة');render()}
function closeCo(id){const c=S.companies.find(x=>x.id===id);modal(`<h3>${T('إغلاق الشركة؟','Close company?')}</h3><p>${esc(c.ar)}<br>${T('ستختفي من القوائم والتقارير والتنبيهات، ويبقى سجلها في الأرشيف. لا تصفية قانونية أو محاسبية.','Will disappear from lists, reports and alerts; history archived. No legal or accounting liquidation.')}</p><div class="actions"><button class="btn" onclick="closeM()">${T('إلغاء','Cancel')}</button><button class="btn d" onclick="doClose(${id})">${T('تأكيد الإغلاق','Confirm closure')}</button></div>`)}
function doClose(id){const c=S.companies.find(x=>x.id===id);c.status='closed';c.show=false;S.reports=S.reports.filter(r=>r.co!==id||['sent','approved'].includes(r.status));log('إغلاق شركة '+c.ar);closeM();render()}
function coNote(id){const c=S.companies.find(x=>x.id===id);form(T('ملاحظة المالك السرية (لا تُفوّض لأي دور)','Owner private note (not delegable)'),[{k:'n',l:T('الملاحظة','Note'),t:'area',v:c.note}],T('حفظ','Save'),o=>{c.note=o.n;log('تعديل ملاحظة سرية')})}

/* reports */
const canSee=r=>role==='owner'||role==='bd'?(r.status==='sent'||(role==='bd'&&r.co===0)):role==='acc'?r.status!=='draft':isMgr()?r.co===myCo():false;
V.reports=()=>{const per=curPer();let rows=S.reports.filter(canSee).sort((a,b)=>b.per.localeCompare(a.per)).map(r=>`<tr><td>${r.per}</td><td>${esc(coName(r.co))}</td><td>${coCur(r.co)}</td><td>${chip('rep',r.status)}</td><td>${dueOf(r.per)}</td><td><button class="btn" onclick="go('rep:${r.id}')">${T('فتح','Open')}</button></td></tr>`);
 let h=head(T('التقارير الشهرية','Monthly reports'),role==='acc'?T('مراجعة، إعادة بسبب، اعتماد، إرسال للإدارة. لا تعديل لأرقام المدير.','Review, return with reason, approve, send. No editing of manager figures.'):T('الاستحقاق: اليوم الخامس من الشهر التالي للفترة.','Due: 5th of the month following the period.'),isMgr()?`<button class="btn p" onclick="newPeriod()">${T('تقرير جديد','New report')}</button>`:'');
 if(isMgr())h+=repAlertsFor(myCo());
 return h+tbl([T('الفترة','Period'),T('الشركة','Company'),T('العملة','Currency'),T('الحالة','Status'),T('الاستحقاق','Due'),''],rows)};
function newPeriod(){const per=curPer(),ex=S.reports.find(r=>r.co===myCo()&&r.per===per);if(['approved','sent'].includes(ex.status))return modal(`<h3>${T('غير مسموح','Not allowed')}</h3><p>${T('يوجد تقرير معتمد لهذه الشركة والفترة. لا يسمح بتقرير معتمد مكرر.','An approved report already exists for this company and period. Duplicates are blocked.')}</p><div class="actions"><button class="btn" onclick="closeM()">OK</button></div>`);go('rep:'+ex.id)}
V.rep=id=>{const r=S.reports.find(x=>x.id==id);
 if(!r||!canSee(r)){log('محاولة وصول مرفوضة إلى تقرير '+id);return head('403',T('ممنوع','Forbidden'))+`<div class="alert bad">${T('ليست لديك صلاحية الوصول إلى هذا التقرير. الرفض يُفرض في الخادم حتى عند فتح الرابط مباشرة، وسُجلت المحاولة في سجل النشاط.','You have no access to this report. Enforced server-side even by direct link. The attempt was logged.')}</div>`}
 const edit=(isMgr()&&r.co===myCo()&&['draft','returned'].includes(r.status))||(role==='bd'&&r.co===0&&['draft','returned'].includes(r.status));
 const accAct=role==='acc';
 const roots=r.snap.filter(f=>!f.parent);
 const inp=f=>{const v=r.vals[f.id]==null?'':r.vals[f.id];return edit?(f.t==='qa'?`<input data-f="${f.id}" value="${esc(v)}" style="width:100%">`:`<input data-f="${f.id}" type="number" value="${esc(v)}" style="width:150px">`):`<b>${f.t==='num'?fmt(v):esc(v)||'—'}</b>`};
 const frow=(f,ch)=>`<tr><td>${ch?'↳ ':''}${esc(T(f.ar,f.en))}${f.req?' *':''}</td><td>${inp(f)}</td></tr>`;
 let rows='';roots.forEach(f=>{rows+=frow(f);r.snap.filter(c=>c.parent===f.id).forEach(c=>rows+=frow(c,1))});
 let h=head(`${T('تقرير','Report')} ${r.per} · ${coName(r.co)}`,`${T('العملة','Currency')}: ${coCur(r.co)} · ${chip('rep',r.status)} · ${T('الاستحقاق','Due')} ${dueOf(r.per)}`,`<button class="btn" onclick="go('reports')">${T('رجوع','Back')}</button>`);
 if(r.status==='returned')h+=`<div class="alert bad"><b>${T('أُعيد للتعديل. السبب:','Returned. Reason:')}</b> ${esc(r.reason)}</div>`;
 if(edit)h+=repAlert(r);
 h+=`<div class="tw"><table><thead><tr><th>${T('الحقل','Field')}</th><th>${T('القيمة','Value')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 h+=`<div class="sec">${T('التقرير الإداري','Management narrative')}</div>${edit?`<textarea id="narr" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)">${esc(r.narr)}</textarea><label class="f c" style="margin-top:8px"><input type="checkbox" id="bk" ${r.bank?'checked':''}>${T('تم إرفاق كشف الحساب البنكي للشهر (إلزامي)','Bank statement attached (mandatory)')}</label>`:`<div class="card">${esc(r.narr)||'—'}<br><span class="muted">${T('كشف البنك','Bank statement')}: ${r.bank?T('مرفق','attached'):T('غير مرفق','missing')}</span></div>`}`;
 h+=`<div class="sec">${T('سجل التغييرات','Change log')}</div>`+r.hist.map(x=>`<div class="thread">${x.d} · ${esc(x.t)}</div>`).join('');
 h+=`<div class="actions">`;
 if(edit)h+=`<button class="btn" onclick="saveRep(${r.id},0)">${T('حفظ المسودة','Save draft')}</button><button class="btn p" onclick="saveRep(${r.id},1)">${T('إرسال للمحاسبة','Send to accountant')}</button>`;
 if(accAct&&['submitted','resubmitted'].includes(r.status))h+=`<button class="btn d" onclick="retRep(${r.id})">${T('إعادة للتصحيح','Return for correction')}</button><button class="btn p" onclick="apprRep(${r.id})">${T('اعتماد','Approve')}</button>`;
 if(accAct&&r.status==='approved')h+=`<button class="btn p" onclick="sendRep(${r.id})">${T('إرسال للإدارة','Send to management')}</button>`;
 if(r.status!=='draft')h+=`<button class="btn" onclick="xl(${r.id})">${T('تنزيل Excel','Download Excel')}</button>`;
 return h+`</div>`};
function collect(r){document.querySelectorAll('[data-f]').forEach(i=>{const f=r.snap.find(x=>x.id===i.dataset.f);r.vals[f.id]=f.t==='num'&&i.value!==''?+i.value:i.value});r.narr=($('#narr')||{}).value||'';r.bank=!!($('#bk')||{}).checked}
function saveRep(id,send){const r=S.reports.find(x=>x.id===id);collect(r);
 if(send){const miss=r.snap.filter(f=>f.req&&(r.vals[f.id]===undefined||r.vals[f.id]===''));if(miss.length)return toast(T('حقول إلزامية ناقصة: ','Missing required: ')+miss.map(f=>T(f.ar,f.en)).join('، '));if(!r.bank)return toast(T('كشف الحساب البنكي إلزامي','Bank statement is mandatory'));
  const was=r.status;r.status=was==='returned'?'resubmitted':'submitted';r.hist.push({t:r.status==='resubmitted'?'resubmitted (معاد إرساله)':'submitted',d:TODAY});mail(usersOf('acc'),'تقرير جديد للمراجعة',coName(r.co)+' - '+r.per);log('إرسال تقرير '+coName(r.co));toast(T('أُرسل للمحاسبة وثُبتت نسخة الإرسال','Sent; submission snapshot kept'))}
 else{r.hist.push({t:'draft saved',d:TODAY});toast(T('حُفظت المسودة. لا تصل للمراجعة قبل الإرسال.','Draft saved; not visible to review.'))}render()}
function retRep(id){const r=S.reports.find(x=>x.id===id);form(T('إعادة للتعديل','Return for correction'),[{k:'why',l:T('السبب (إلزامي، واضح)','Reason (mandatory)'),t:'area',r:1}],T('إعادة','Return'),o=>{r.status='returned';r.reason=o.why;r.hist.push({t:'returned: '+o.why,d:TODAY});const c=S.companies.find(x=>x.id===r.co);mail(c?c.mgr:usersOf('bd'),'أُعيد التقرير للتعديل',o.why);log('إعادة تقرير');})}
function apprRep(id){const r=S.reports.find(x=>x.id===id);if(S.reports.some(x=>x.co===r.co&&x.per===r.per&&['approved','sent'].includes(x.status)&&x.id!==id))return toast(T('يوجد تقرير معتمد مكرر','Duplicate approved report'));r.status='approved';r.hist.push({t:'approved',d:TODAY});const c=S.companies.find(x=>x.id===r.co);mail(c?c.mgr:usersOf('bd'),'اعتُمد التقرير',coName(r.co));log('اعتماد تقرير');toast(T('اعتُمد: التقرير مقفل للقراءة','Approved: locked'));render()}
function sendRep(id){const r=S.reports.find(x=>x.id===id);r.status='sent';r.hist.push({t:'sent to management',d:TODAY});mail(usersOf('owner').concat(usersOf('bd')),'تقرير معتمد وصل للإدارة',coName(r.co)+' - '+r.per);log('إرسال تقرير للإدارة');render()}
function xl(id){const r=S.reports.find(x=>x.id===id);modal(`<h3>${T('معاينة ملف Excel','Excel download preview')}</h3><p class="muted">${esc(coName(r.co))} · ${r.per} · ${coCur(r.co)} · ${ST.rep[r.status][0]} · ${T('محاكاة: لا يُنزَّل ملف فعلي هنا','simulation: no real file')}</p><div class="tw"><table><thead><tr><th>${T('الحقل','Field')}</th><th>${T('القيمة','Value')}</th></tr></thead><tbody>${r.snap.map(f=>`<tr><td>${esc(T(f.ar,f.en))}</td><td>${esc(r.vals[f.id]==null?'':r.vals[f.id])}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" onclick="closeM()">${T('إغلاق','Close')}</button></div>`)}

/* form builder */
V.formb=()=>head(T('منشئ النماذج','Form builder'),T('استمارة واحدة مرنة للقابضة والشركات. التغيير الهيكلي يسري على الفترة القادمة فقط، والتقارير السابقة تحتفظ بنسختها.','One flexible form. Structure changes apply to the next period only; past reports keep their version.'),`<button class="btn p" onclick="addField()">${T('إضافة حقل','Add field')}</button>`)+tbl([T('الحقل (عربي)','Field (AR)'),T('Field (EN)','Field (EN)'),T('النوع','Type'),T('إلزامي','Required'),T('الأب','Parent'),T('الحالة','Status'),''],S.fields.map(f=>`<tr><td>${esc(f.ar)}</td><td>${esc(f.en)}</td><td>${f.t==='num'?T('رقم','Number'):f.t==='qa'?T('سؤال/إجابة','Q&A'):T('معلومة','Info')}</td><td>${f.req?'✓':''}</td><td>${f.parent?esc(S.fields.find(x=>x.id===f.parent).ar):''}</td><td>${f.on?'<span class="chip ok">'+T('فعال','Active')+'</span>':'<span class="chip">'+T('موقوف','Inactive')+'</span>'}</td><td><button class="btn" onclick="togField('${f.id}')">${f.on?T('إيقاف','Deactivate'):T('تفعيل','Activate')}</button></td></tr>`))+`<div class="alert info" style="margin-top:12px">${T('جرّب: أضف حقلاً ثم غيّر تاريخ المحاكاة إلى الشهر التالي لترى التقرير الجديد بالهيكل الجديد بينما التقرير القديم محفوظ بنسخته.','Try: add a field, then move the simulated date to next month.')}</div>`;
function addField(){form(T('إضافة حقل','Add field'),[{k:'ar',l:T('الاسم بالعربية','Arabic label'),r:1},{k:'en',l:T('الاسم بالإنجليزية','English label'),r:1},{k:'t',l:T('النوع','Type'),t:'sel',r:1,o:[['num',T('رقم','Number')],['qa',T('سؤال/إجابة','Q&A')],['info',T('معلومة معروضة','Display info')]]},{k:'parent',l:T('حقل رئيسي (للبند الفرعي)','Parent field'),t:'sel',o:S.fields.filter(f=>!f.parent).map(f=>[f.id,f.ar])},{k:'req',l:T('إلزامي','Required'),t:'chk'}],T('حفظ','Save'),o=>{S.fields.push({id:'f'+uid++,ar:o.ar,en:o.en,t:o.t,req:o.req?1:0,parent:o.parent,on:1});log('إضافة حقل '+o.ar)})}
function togField(id){const f=S.fields.find(x=>x.id===id);f.on=f.on?0:1;log('تغيير حالة حقل '+f.ar);render()}

/* leads */
V.leads=()=>{const mine=S.leads.filter(l=>(role==='mkt'?l.by===me().id:isMgr()?l.co===myCo():true)&&(l.co===0||S.companies.find(c=>c.id===l.co)?.status==='active'));
 return head(T('العملاء المحتملون','Leads'),T('المالك ومطور الأعمال يرون الجميع، المسوّق عملاءه، ومدير الشركة المحوّلين إليه فقط.','Owner/BD see all; marketer own; manager only routed to their company.'),(isMgr()||role==='acc'||role==='des')?'':`<button class="btn p" onclick="newLead()">${T('عميل جديد','New lead')}</button>`)+tbl([T('الاسم','Name'),T('التواصل','Contact'),T('الخدمة','Service'),T('المصدر','Source'),T('الشركة','Company'),T('المتابعة','Follow-up'),T('الحالة','Status'),T('ملاحظة','Note'),''],mine.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.contact)}</td><td>${esc(l.service)}</td><td>${esc(l.source)}</td><td>${esc(coName(l.co))}</td><td>${esc(U(l.follow))}</td><td>${chip('lead',l.status)}</td><td>${esc(l.note)}</td><td>${(isMgr()||role==='owner'||role==='bd')?`<button class="btn" onclick="updLead(${l.id})">${T('تحديث','Update')}</button>`:''}</td></tr>`))};
function newLead(){form(T('عميل محتمل جديد','New lead'),[{k:'name',l:T('الاسم','Name'),r:1},{k:'contact',l:T('وسيلة التواصل','Contact'),r:1},{k:'service',l:T('الخدمة المطلوبة','Requested service'),r:1},{k:'source',l:T('المصدر','Source')},{k:'co',l:T('الشركة المستلمة (قائمة الشركات المسجلة)','Receiving company (registered)'),t:'sel',r:1,o:S.companies.filter(c=>c.status==='active').map(c=>[c.id,T(c.ar,c.en)])},{k:'note',l:T('ملاحظة مختصرة','Short note'),t:'area'}],T('حفظ وتحويل','Save & route'),o=>{const c=S.companies.find(x=>x.id==o.co);S.leads.push({id:uid++,name:o.name,contact:o.contact,service:o.service,source:o.source,co:+o.co,note:o.note,status:'new',by:me().id,follow:c.mgr,date:TODAY});mail(c.mgr,'تحويل عميل محتمل إليك',o.name);log('إنشاء عميل محتمل');toast(T('حُوّل العميل ووصل البريد لمدير الشركة','Routed; manager emailed'))})}
function updLead(id){const l=S.leads.find(x=>x.id===id);form(T('تحديث العميل','Update lead'),[{k:'status',l:T('الحالة','Status'),t:'sel',o:Object.keys(ST.lead).map(k=>[k,ST.lead[k][0]]),v:l.status},{k:'note',l:T('ملاحظة (في سجل العميل نفسه)','Note (in the lead record)'),t:'area',v:l.note}],T('حفظ','Save'),o=>{l.status=o.status;l.note=o.note;log('تحديث عميل')})}
function complain(){form(T('شكوى للمالك فقط','Complaint to Owner only'),[{k:'t',l:T('النص','Text'),t:'area',r:1}],T('إرسال','Send'),o=>{mail(usersOf('owner'),'شكوى من المسوّق',o.t);log('شكوى مسوّق');toast(T('أُرسلت للمالك فقط','Sent to Owner only'))})}

/* service requests */
V.reqs=()=>{const list=S.reqs.filter(r=>isMgr()?r.co===myCo():role==='acc'?r.type==='acc':role==='des'?r.type==='des':true);
 return head(T('طلبات الخدمات','Service requests'),T('المحاسبة ← المحاسب · التصميم ← المصمم · دراسة/مساعدة ← مطوّر الأعمال','Accounting→Accountant · Design→Designer · Study→BD'),isMgr()?`<button class="btn p" onclick="newReq()">${T('طلب خدمة جديد','New request')}</button>`:'')+list.map(r=>`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${esc(r.subj)}</b>${chip('req',r.status)}</div><div class="muted">${esc(coName(r.co))} · ${T(SERV[r.type][0],SERV[r.type][1])} → ${esc(U(usersOf(SERV[r.type][2])[0]))} · ${T('الأولوية','Priority')}: ${esc(r.prio)} · ${T('الموعد','Due')}: ${r.due||'—'}</div><p>${esc(r.need)}</p>${r.thread.map(t=>`<div class="thread"><b>${esc(t.u)}</b>: ${esc(t.t)}</div>`).join('')}<div class="row">${(role==='acc'&&r.type==='acc')||(role==='des'&&r.type==='des')||(role==='bd'&&r.type==='study')||isMgr()?`<button class="btn" onclick="replyReq(${r.id})">${T('رد / تحديث الحالة','Reply / update status')}</button>`:''}${role==='bd'&&r.type!=='study'?`<span class="muted">${T('مطلع فقط (مُخطَر)','Informed only')}</span>`:''}</div></div>`).join('')||`<div class="alert info">${T('لا طلبات','No requests')}</div>`};
function newReq(){form(T('طلب خدمة جديد','New service request'),[{k:'type',l:T('نوع الخدمة','Service type'),t:'sel',r:1,o:Object.keys(SERV).map(k=>[k,T(SERV[k][0],SERV[k][1])])},{k:'subj',l:T('الموضوع','Subject'),r:1},{k:'need',l:T('وصف الاحتياج','Need'),t:'area',r:1},{k:'prio',l:T('الأولوية','Priority'),t:'sel',o:[['عادية',T('عادية','Normal')],['عاجلة',T('عاجلة','Urgent')]],v:'عادية'},{k:'due',l:T('الموعد المطلوب','Due date'),t:'date'}],T('إرسال مباشرة (بلا موافقة مسبقة)','Send directly'),o=>{const co=myCo();S.reqs.push({id:uid++,co,type:o.type,subj:o.subj,need:o.need,prio:o.prio||'عادية',due:o.due,status:'new',by:me().id,thread:[]});mail(usersOf(SERV[o.type][2]),'طلب خدمة جديد',o.subj);if(o.type!=='study')mail(usersOf('bd'),'إشعار: طلب خدمة جديد',o.subj);log('طلب خدمة');toast(T('وصل الطلب للمختص وأُخطر مطور الأعمال','Specialist notified; BD informed'))})}
function replyReq(id){const r=S.reqs.find(x=>x.id===id);form(T('رد وتحديث','Reply & status'),[{k:'t',l:T('الرد','Reply'),t:'area',r:1},{k:'st',l:T('الحالة','Status'),t:'sel',o:Object.keys(ST.req).map(k=>[k,ST.req[k][0]]),v:r.status}],T('حفظ','Save'),o=>{r.thread.push({u:me().name,t:o.t});r.status=o.st||r.status;const c=S.companies.find(x=>x.id===r.co);if(!isMgr()){mail(c?c.mgr:[],'تحديث على طلبك',o.t);mail(usersOf('bd'),'إشعار: تحديث طلب',r.subj)}log('رد على طلب')})}

/* opportunities */
V.opps=()=>head(T('الفرص التجارية والاستثمارية','Business & investment opportunities'),T('الاعتماد لا يؤدي إلى التنفيذ أو النشر تلقائياً.','Approval never triggers execution or publishing.'),role==='bd'?`<button class="btn p" onclick="newOpp()">${T('فرصة جديدة','New opportunity')}</button>`:'')+tbl([T('الموضوع','Topic'),T('الدولة','Country'),T('الملف','Study file'),T('المصدر','Source'),T('الحالة','Status'),T('السبب','Reason'),''],S.opps.filter(o=>role==='owner'?o.status!=='draft':true).map(o=>`<tr><td>${esc(o.topic)}<br><span class="muted">${esc(o.desc)}</span></td><td>${cn(o.country)}</td><td>${esc(o.study)||'—'}</td><td>${o.src==='site'?T('الموقع','Website'):T('داخلي','Internal')}</td><td>${chip('opp',o.status)}</td><td>${esc(o.reason)}</td><td class="row">${role==='bd'&&o.status==='draft'?`<button class="btn p" onclick="sendOpp(${o.id})">${T('إرسال للمالك','Send to Owner')}</button>`:''}${role==='owner'&&['sent','review','postponed'].includes(o.status)?`<button class="btn" onclick="decOpp(${o.id},'review')">${T('قيد المراجعة','Review')}</button><button class="btn p" onclick="decOpp(${o.id},'approved')">${T('اعتماد','Approve')}</button><button class="btn d" onclick="decOpp(${o.id},'rejected')">${T('رفض','Reject')}</button><button class="btn" onclick="decOpp(${o.id},'postponed')">${T('تأجيل','Postpone')}</button>`:''}</td></tr>`));

V.ai=()=>{const per=curPer();let lines=[];
 const scopeCos=isMgr()?[myCo()]:S.companies.filter(c=>c.status==='active').map(c=>c.id);
 scopeCos.forEach(id=>{const r=S.reports.find(x=>x.co===id&&x.per===per);if(r&&['draft','returned'].includes(r.status)&&dd(dueOf(per),TODAY)<0)lines.push([T(`تقرير ${coName(id)} متأخر ${-dd(dueOf(per),TODAY)} يوماً`,`${coName(id)} report overdue`),T('تقرير شهري '+per,'Monthly report '+per),T('مرتفعة','High'),'rep:'+r.id]);
  const l=[...S.reports].reverse().filter(x=>x.co===id&&x.status==='sent');if(l.length>=1){const x=l[0];if(x.vals.bank!=null&&x.vals.rev<x.vals.exp)lines.push([T(`${coName(id)}: المصاريف أعلى من الإيراد في ${x.per}`,`${coName(id)}: expenses above revenue`),T('تقرير '+x.per,'Report '+x.per),T('مرتفعة','High'),'rep:'+x.id])}});
 if(role==='owner'){S.opps.filter(o=>o.status==='sent').forEach(o=>lines.push([T('قرار فرصة معلق: '+o.topic,'Pending opportunity decision'),T('سجل الفرصة','Opportunity record'),T('مرتفعة','High'),'opps']));S.dirs.filter(d=>d.status!=='done'&&d.due<TODAY).forEach(d=>lines.push([T('توجيه متأخر: '+d.title,'Overdue directive'),T('سجل التوجيه','Directive'),T('مرتفعة','High'),'dirs']))}
 let h=head(T('المساعد الذكي','AI assistant'),T('أداة تحليل ودعم قرار. لا يصدر قراراً ولا يرسل توجيهاً تلقائياً.','Analysis & decision support. Never decides or sends directives.'));
 h+=`<div class="alert info">${isMgr()?T('نطاقك: بيانات شركتك فقط، دون ملاحظات المالك السرية.','Scope: your company only; no Owner private notes.'):T('نطاقك: ملخص المجموعة. القرار النهائي للمالك. مرفقات الإجازات خارج التحليل.','Scope: group summary. Final decision is the Owner’s. Leave attachments excluded.')}</div>`;
