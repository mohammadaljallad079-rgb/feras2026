name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safir
          POSTGRES_PASSWORD: safir
          POSTGRES_DB: safir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safir -d safir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The unit/integration suite owns `safir_test` and drops its tables between
      # tests, so the live API the end-to-end journeys talk to must not share it.
      DATABASE_URL: postgresql+psycopg://safir:safir@localhost:5432/safir_test
      E2E_DATABASE_URL: postgresql+psycopg://safir:safir@localhost:5432/safir_e2e
      SECRET_KEY: ci-secret
      STORAGE_DIR: /tmp/safir-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Create the end-to-end database
        run: |
          PGPASSWORD=safir psql -h localhost -U safir -d safir_test \
            -c "CREATE DATABASE safir_e2e;"
      - name: Run migrations against a real PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          DATABASE_URL="$E2E_DATABASE_URL" alembic upgrade head
      - name: Seed the end-to-end database
        working-directory: backend
        run: DATABASE_URL="$E2E_DATABASE_URL" python scripts/seed.py
      - name: Start the API the journeys talk to
        working-directory: backend
        run: |
          DATABASE_URL="$E2E_DATABASE_URL" \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          exit 1
      - name: Unit, integration and API tests
        working-directory: backend
        env:
          SAFIR_BASE_URL: http://127.0.0.1:8000
        run: pytest -q

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint:ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
