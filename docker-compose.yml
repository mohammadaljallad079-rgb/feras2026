# Development and reference deployment for the Safir Holding Platform.
#
#   cp .env.example .env      # then set real values
#   docker compose up --build
#
# The database is the only stateful service; the backend applies migrations on
# start. No credential is baked into an image.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-safir}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safir} -d ${POSTGRES_DB:-safir}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default: only the backend needs to reach it.
    expose:
      - "5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safir}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      STORAGE_DIR: /var/lib/safir/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - storage:/var/lib/safir/storage
    expose:
      - "8000"

  # §7.5 / §12.3: the deadline reminders run automatically at a fixed Bahrain
  # hour, with a bounded 15-minute retry. The policy lives in
  # app/services/scheduler.py; the durable per-day claim in
  # app/services/reminders.py makes a restart or an overlapping run harmless.
  scheduler:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safir}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      STORAGE_DIR: /var/lib/safir/storage
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-Asia/Bahrain}
      REMINDER_SCHEDULE_TIME: ${REMINDER_SCHEDULE_TIME:-07:00}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      TZ: ${REMINDERS_TIMEZONE:-Asia/Bahrain}
    volumes:
      # The success marker lives here, so a restart does not repeat the day and
      # a missed day is caught up rather than skipped.
      - storage:/var/lib/safir/storage
    command: ["python", "-m", "app.services.scheduler"]
    # The image's HEALTHCHECK probes the HTTP server, which this container does
    # not run; left enabled it would report the job unhealthy forever.
    healthcheck:
      disable: true
    # No ports: the scheduler only writes to the database and the mail transport.

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  storage:
