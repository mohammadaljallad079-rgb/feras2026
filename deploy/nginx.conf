# Reverse proxy for the Safir Holding Platform.
#
# Fronts the Next.js UI and forwards /api to the FastAPI backend so the browser
# talks to a single origin (no CORS in production, tokens stay same-site).
# Health and readiness probes are exposed directly for the orchestrator.

upstream safir_frontend {
    server frontend:3000;
}

upstream safir_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Sensitive uploads can be large; keep a bounded, explicit ceiling.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        proxy_pass http://safir_backend/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://safir_backend/ready;
        access_log off;
    }

    # The versioned REST API and its docs are served by FastAPI.
    location /api/ {
        proxy_pass http://safir_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://safir_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
